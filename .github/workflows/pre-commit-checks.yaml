# used for running pre-commit checks
name: pre-commit checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  run_pre_commit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
